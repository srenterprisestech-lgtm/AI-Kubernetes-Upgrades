name: Destroy AWS multi-region lab

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to permanently delete the lab resources
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-multiregion-active-active-lab
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aws-multiregion-active-active-lab/infra
    steps:
      - uses: actions/checkout@v4
      - name: Confirm destructive operation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DESTROY" ]]; then
            echo "Confirmation must be exactly DESTROY." >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize Terraform backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION"
      - name: Review destroy plan
        run: terraform plan -destroy -input=false -out=tfplan
      - name: Destroy lab resources
        run: terraform apply -input=false -auto-approve tfplan
